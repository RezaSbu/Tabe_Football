labels: ["\u0628\u0627\u06AF", "\u062a\u0648\u0636\u062d"]
body:
  - type: textarea
    id: description
    attributes:
      label: "\u062a\u0648\u0636\u06cc\u062d \u0628\u0627\u06AF"
      description: "\u0628\u0627\u06AF \u0631\u0627 \u062a\u0648\u0636\u06cc\u062d \u062f\u0647\u06cc\u062f"
      placeholder: "\u0645\u062b\u0644\u0627...\u0627\u0635\u0644\u0627\u062d \u0635\u0641\u062d\u0647 \u062e\u0631\u0627\u0628 \u0631\u0627 \u062a\u0648\u0636\u06cc\u062d \u06a9\u0646\u06cc\u062f"
