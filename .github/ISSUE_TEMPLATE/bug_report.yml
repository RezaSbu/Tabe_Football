  - type: textarea
    id: additional
    attributes:
      label: "\u0627\u0637\u0644\u0627\u0639\u0627\u062a \u0627\u0636\u0627\u0641\u06cc"
      description: "\u0627\u0637\u0644\u0627\u0639\u0627\u062a \u0627\u0636\u0627\u0641\u06cc \u062f\u0631\u0628\u0627\u0631\u0647 \u0628\u0627\u06af"
    validations:
      required: false
