      label: "\u0645\u0631\u0627\u062d\u0644 \u062a\u06a9\u0631\u0627\u0631"
      description: "\u0645\u0631\u0627\u062d\u0644 \u06af\u0632\u0627\u0631\u0634 \u0628\u0627\u0631\u062f\u0647"
      placeholder: |
        1. برید به صفحه ...
        2. روی دکمه ... کلیک کنید
        3. ببینید خطا میده
