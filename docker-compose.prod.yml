# ============================================
# Tabe Football - Production Overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================
services:
  postgres:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    environment:
      # V8 sizes its default heap from the cgroup when NODE_OPTIONS is absent:
      # measured inside the live container on 2026-11-25 -> heap_size_limit
      # 259 MB with memory.max 512 MB. The process then died 5 times with
      # "Reached heap limit Allocation failed" at 248.8 -> 249.6 MB live after
      # a full Mark-Compact, i.e. the app genuinely needed more than the cap.
      # Pin the cap so it no longer depends on how the container is sized, and
      # keep the heap below the cgroup limit so a regression surfaces as a
      # diagnosable V8 abort instead of a silent SIGKILL.
      NODE_OPTIONS: "--max-old-space-size=512"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/public:ro
    # proxy_cache stores responses under /var/cache/nginx/tabe. In the official
    # image that tree belongs to root while the workers run as `nginx`, so a
    # non-writable cache dir fails silently: every response is served but never
    # stored, and X-Cache-Status stays MISS forever (observed in production for
    # both /api/data and /assets/). Own the dir before the master starts.
    command:
      - /bin/sh
      - -c
      - mkdir -p /var/cache/nginx/tabe && chown -R nginx:nginx /var/cache/nginx && exec nginx -g 'daemon off;'
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
