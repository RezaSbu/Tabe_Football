limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# دیسک‌کش معکوس (proxy_cache). این فایل داخل http کانتکست ایمیج nginx:alpine
# لود می‌شود (include /etc/nginx/conf.d/*.conf در nginx.conf پیش‌فرض) پس
# proxy_cache_path همین‌جا معتبر است. بعد از هر تغییر، روی VPS حتماً:
#   docker exec <nginx-container> nginx -t && docker exec <nginx-container> nginx -s reload
# max_size was 200m: measured 133.5 MB live and climbing, i.e. the cache was
# evicting entries it should have kept (HIT ratio suffers exactly when traffic
# spikes). 1g costs no RAM — keys_zone stays 20m — and only disk, which Phase-1
# hygiene frees first. inactive=30d matches the 7d→30d retention of the pages
# that are cheap to serve from disk and expensive to rebuild (28.7 MB /api/data).
proxy_cache_path /var/cache/nginx/tabe levels=1:2 keys_zone=tabe_cache:20m max_size=1g inactive=30d use_temp_path=off;

# Keep-alive pool to the Node app. Without an upstream block nginx opened a
# fresh TCP connection per proxied request (assets, API, HTML), which on a
# single-vCPU box shows up as connect time on every request.
upstream app_upstream {
    server app:3000;
    keepalive 32;
}

# Per-request timing so slow endpoints are identifiable from the edge log
# instead of guessing: rt = total, uct/uht/urt = upstream connect/header/body,
# cache = HIT/MISS/BYPASS.
log_format tabe_timed '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time '
                      'urt=$upstream_response_time cache=$upstream_cache_status';

# بلاک اسکنرها، بات‌های پرخور و درخواست‌های مخرب شناخته‌شده (بدون پاسخ = کم‌هزینه‌ترین)
map $http_user_agent $block_bot {
    default 0;
    ~*GPTBot 1;
    ~*ChatGPT-User 1;
    ~*OAI-SearchBot 1;
    ~*PerplexityBot 1;
    ~*ClaudeBot 1;
    ~*anthropic-ai 1;
    ~*Bytespider 1;
    ~*Diffbot 1;
    ~*ImagesiftBot 1;
    ~*CCBot 1;
    ~*DataForSeoBot 1;
    ~*SemrushBot 1;
    ~*AhrefsBot 1;
    ~*MJ12bot 1;
    ~*python-requests 1;
    ~*python-urllib 1;
    ~*scrapy 1;
    ~*curl 1;
    ~*wget 1;
    ~*zgrab 1;
    ~*masscan 1;
    ~*nmap 1;
    ~*sqlmap 1;
    ~*nikto 1;
    ~*acunetix 1;
}

# /api/data is gzip-compressed ONCE inside Node (memoized per data revision) and
# the edge cache stores those compressed bytes. That matters because nginx's own
# gzip filter runs on every response it SENDS — including a cache HIT — so a HIT
# would otherwise re-gzip 28.7 MB on the nginx container (0.5 vCPU cap) on every
# request. Normalising the header also keeps the cache key honest: the upstream
# sees exactly "" or "gzip", never "br, zstd, gzip;q=0.8".
map $http_accept_encoding $tabe_upstream_accept_encoding {
    default  "";
    "~*gzip" "gzip";
}

# مسیرهای اسکنِ شناخته‌شده (تزریق، دوربین، وب‌شل و...) که هیچ‌وقت نباید به اپ برسند
map $request_uri $block_path {
    default 0;
    ~*\.env 1;
    ~*\.git/ 1;
    ~*config\.php 1;
    ~*wp-admin 1;
    ~*wp-login 1;
    ~*xmlrpc\.php 1;
    ~*/shell 1;
    ~*cmd(\.exe)? 1;
    ~*/onvif/ 1;
    ~*/.aws/ 1;
    ~*/.ssh/ 1;
    ~*/cgi-bin 1;
    ~*phpmyadmin 1;
    ~*actuator 1;
    ~*solr/ 1;
    ~*^/(?!api/).*\.sql(\.gz)?$ 1;
}

    # HTTP -> HTTPS redirect + ACME challenge
    server {
    listen 80 default_server;
    server_name tabefotbal.ir www.tabefotbal.ir;

    charset utf-8;

    if ($block_bot) { return 444; }
    if ($block_path) { return 444; }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS main server
server {
    listen 443 ssl;
    http2 on;
    server_name tabefotbal.ir;

    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/tabefotbal.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tabefotbal.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    if ($block_bot) { return 444; }
    if ($block_path) { return 444; }

    # Security headers are NOT set here. Every proxied response (SPA, /api/*,
    # /assets/, /fonts/, /api/image-proxy) already carries helmet's set, and
    # adding the same names at the edge produced combined values such as
    # `X-Frame-Options: SAMEORIGIN, SAMEORIGIN` plus two conflicting
    # Referrer-Policy values. The app is the single source for dynamic
    # responses; only the purely static locations below repeat what they need.

    access_log /var/log/nginx/access.log tabe_timed;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    location /uploads/ {
        alias /uploads/;
        # `expires 30d` + `add_header Cache-Control "public, immutable"` emitted
        # TWO Cache-Control headers and the added one had no max-age. Uploaded
        # names are timestamped and never rewritten in place, so one immutable
        # year is both correct and cheaper (no revalidation at all).
        # Deliberately NOT `always`: a missing upload must not be cached as a
        # year-long 404.
        add_header Cache-Control "public, max-age=31536000, immutable";
        # This location sets add_header, so it no longer inherits anything;
        # repeat the static-response security headers the app cannot provide.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;

        # هاتلینک‌پروتکشن: فقط سایت‌های مجاز می‌توانند تصویر را ایمبد کنند؛ بقیه 403.
        valid_referers none blocked
            *.tabefotbal.ir tabefotbal.ir www.tabefotbal.ir *.google.com *.googleusercontent.com
            *.bing.com *.yandex.com *.yandex.ru t.co l.instagram.com *.instagram.com
            *.facebook.com *.whatsapp.com *.telegram.org *.t.me *.telegram.me
            *.linkedin.com *.twitter.com *.pinterest.com;
        if ($invalid_referer) {
            return 403;
        }
    }

    # لوگو و فایل‌های استاتیک ریشه با کش طولانی (فایل‌ها هش‌دار/تغییرناپذیرند)
    # توجه: location = /logo.png عمداً حذف شده (فایل public/logo.png در قدم
    # بهینه‌سازی فونت/لوگو از ریپو پاک شد؛ سایت فقط logo.webp را مصرف می‌کند).
    # ⚠ کش لوگو فقط با تغییر نام فایل یا ?v= در ارجاع‌ها شکسته می‌شود؛ هر بار
    # فایل عوض شد، مقدار ?v= را در index.html + Header + Footer هم عوض کنید.
    location = /logo.webp {
        alias /public/logo.webp;
        add_header Cache-Control "public, max-age=2592000, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }
    location = /logo-512.png {
        alias /public/logo-512.png;
        add_header Cache-Control "public, max-age=2592000, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location /assets/ {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # serve-static answers `Cache-Control: public, max-age=0` (its default;
        # setHeaders in src/server/index.ts only sets Content-Type). Forwarding
        # that to the browser would make it revalidate every hashed asset, so
        # hide it and state one unambiguous header instead.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # X-Content-Type-Options comes from the app (helmet) on this proxied
        # response; adding it here too produced "nosniff, nosniff".
        add_header X-Cache-Status $upstream_cache_status always;
        access_log off;

        # باندل‌ها هش‌دار و تغییرناپذیرند: کش کوتاه معکوس، ضربه‌ی آپ‌استریم را حذف می‌کند.
        proxy_cache tabe_cache;
        proxy_cache_valid 200 1d;
        proxy_cache_lock on;
        # That same upstream max-age=0 is also the entry lifetime for nginx, so
        # every asset was stale the instant it was written: measured live right
        # after the deploy, /assets/*.js, *.css and /fonts/*.woff2 answered MISS
        # on three identical requests in a row and hit Node every time. Ignore
        # the header for storage only and let proxy_cache_valid decide.
        # (Reproduced in a container against this exact config: MISS -> HIT.)
        proxy_ignore_headers Cache-Control Expires;
    }

    # فونت‌های سلف‌هاست (نام‌فایل ثابت، بدون هش): کش مرورگر متوسط + کش معکوس کوتاه.
    location /fonts/ {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Fixed file names (no content hash) keep a 30-day browser lifetime, but
        # the upstream max-age=0 is hidden for the same reason as /assets/.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Cache-Status $upstream_cache_status always;
        access_log off;

        proxy_cache tabe_cache;
        proxy_cache_valid 200 1d;
        proxy_cache_lock on;
        # Same serve-static max-age=0 trap as /assets/ (fonts measured MISS on
        # every request right after the deploy).
        proxy_ignore_headers Cache-Control Expires;
    }

    # image-proxy استریمینگ: پاسخ‌ها کلید-URL و عملاً تغییرناپذیرند (7 روز کش).
    location = /api/image-proxy {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        # Empty Connection header = let nginx reuse an upstream keepalive slot.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_cache tabe_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
    }

    # /api/data و اسلایس ?lite=1 (هر دو همین exact location؛ query در کلید کش هست):
    # 10 ثانیه کش + revalidate با ETag نسخه‌ای — یعنی بعد از 10 ثانیه فقط یک
    # 304 خالی به آپ‌استریم می‌رود (بدون stringify ده‌مگابایتی) و هم‌زمان
    # هجوم هم‌زمان با proxy_cache_lock به یک درخواست آپ‌استریم فرومی‌ریزد.
    # بای‌پس با Cookie/Authorization تا هیچ پاسخ احرازهویتی کش نشود.
    location = /api/data {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        # Empty Connection header = let nginx reuse an upstream keepalive slot.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # Ask the app for the variant we are about to cache (see the map above).
        proxy_set_header Accept-Encoding $tabe_upstream_accept_encoding;
        # Default key + coding, so a gzipped body is never handed to a client
        # that did not accept gzip (nginx does not vary the cache on `Vary`).
        proxy_cache_key "$scheme$request_method$host$request_uri|$tabe_upstream_accept_encoding";
        # add_header در location ارث‌بری هدرهای امنیتی server را قطع می‌کند؛
        # این‌جا فقط هدر مخصوص کش است، بقیه از خود اپ (helmet) می‌آید.
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_cache tabe_cache;
        proxy_cache_valid 200 10s;
        proxy_cache_revalidate on;
        proxy_cache_lock on;
        # The app marks the bulk payload `Cache-Control: no-cache` so BROWSERS
        # always revalidate through the revision ETag. Nginx honours that header
        # on the upstream response and refuses to store anything, which made
        # every `proxy_cache_valid` above dead weight (verified live: repeated
        # identical requests always answered X-Cache-Status: MISS). Ignore it at
        # the edge only — the header is still forwarded to the client untouched.
        proxy_ignore_headers Cache-Control Expires;
        # Refresh a nearly-expired entry in the background instead of making the
        # next visitor pay the full ~6.8 MB serialization.
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout;
        proxy_no_cache $http_authorization $http_cookie;
        proxy_cache_bypass $http_authorization $http_cookie;
    }

    location /api/auth/ {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        # Empty Connection header = let nginx reuse an upstream keepalive slot.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        # Empty Connection header = let nginx reuse an upstream keepalive slot.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 30m;
    }

    location / {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        # Empty Connection header = let nginx reuse an upstream keepalive slot.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SPA shell + SEO-injected HTML was rendered by Node on every page
        # view. Cache it at the edge for 30s per URL (the injected head meta
        # comes from the in-memory DB, which changes at admin-write speed).
        # Cookie/Authorization bypasses keep admin/logged-in views uncached.
        # The HTML response is proxied from Node, so helmet already set the
        # security headers; repeating them here only duplicated them.
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_cache tabe_cache;
        proxy_cache_valid 200 30s;
        proxy_cache_revalidate on;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout;
        proxy_no_cache $http_authorization $http_cookie;
        proxy_cache_bypass $http_authorization $http_cookie;
    }
}

# www -> bare domain redirect (HTTPS)
server {
    listen 443 ssl;
    http2 on;
    server_name www.tabefotbal.ir;

    ssl_certificate /etc/letsencrypt/live/tabefotbal.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tabefotbal.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://tabefotbal.ir$request_uri;
}
