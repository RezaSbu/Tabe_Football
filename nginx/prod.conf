limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# بلاک اسکنرها، بات‌های پرخور و درخواست‌های مخرب شناخته‌شده (بدون پاسخ = کم‌هزینه‌ترین)
map $http_user_agent $block_bot {
    default 0;
    ~*GPTBot 1;
    ~*ChatGPT-User 1;
    ~*OAI-SearchBot 1;
    ~*PerplexityBot 1;
    ~*ClaudeBot 1;
    ~*anthropic-ai 1;
    ~*Bytespider 1;
    ~*Diffbot 1;
    ~*ImagesiftBot 1;
    ~*CCBot 1;
    ~*DataForSeoBot 1;
    ~*SemrushBot 1;
    ~*AhrefsBot 1;
    ~*MJ12bot 1;
    ~*python-requests 1;
    ~*python-urllib 1;
    ~*scrapy 1;
    ~*curl 1;
    ~*wget 1;
    ~*zgrab 1;
    ~*masscan 1;
    ~*nmap 1;
    ~*sqlmap 1;
    ~*nikto 1;
    ~*acunetix 1;
}

# مسیرهای اسکنِ شناخته‌شده (تزریق، دوربین، وب‌شل و...) که هیچ‌وقت نباید به اپ برسند
map $request_uri $block_path {
    default 0;
    ~*\.env 1;
    ~*\.git/ 1;
    ~*config\.php 1;
    ~*wp-admin 1;
    ~*wp-login 1;
    ~*xmlrpc\.php 1;
    ~*/shell 1;
    ~*cmd(\.exe)? 1;
    ~*/onvif/ 1;
    ~*/.aws/ 1;
    ~*/.ssh/ 1;
    ~*/cgi-bin 1;
    ~*phpmyadmin 1;
    ~*actuator 1;
    ~*solr/ 1;
    ~*\.sql(\.gz)?$ 1;
}

    # HTTP -> HTTPS redirect + ACME challenge
    server {
    listen 80 default_server;
    server_name tabefotbal.ir www.tabefotbal.ir;

    charset utf-8;

    if ($block_bot) { return 444; }
    if ($block_path) { return 444; }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS main server
server {
    listen 443 ssl;
    http2 on;
    server_name tabefotbal.ir;

    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/tabefotbal.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tabefotbal.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    if ($block_bot) { return 444; }
    if ($block_path) { return 444; }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    location /uploads/ {
        alias /uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;

        # هاتلینک‌پروتکشن: فقط سایت‌های مجاز می‌توانند تصویر را ایمبد کنند؛ بقیه 403.
        valid_referers none blocked server_names
            *.tabefotbal.ir tabefotbal.ir *.google.com *.googleusercontent.com
            *.bing.com *.yandex.com *.yandex.ru t.co l.instagram.com *.instagram.com
            *.facebook.com *.whatsapp.com *.telegram.org *.t.me *.telegram.me
            *.linkedin.com *.twitter.com *.pinterest.com;
        if ($invalid_referer) {
            return 403;
        }
    }

    # لوگو و فایل‌های استاتیک ریشه با کش طولانی (فایل‌ها هش‌دار/تغییرناپذیرند)
    location = /logo.webp {
        alias /public/logo.webp;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location = /logo.png {
        alias /public/logo.png;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location = /logo-512.png {
        alias /public/logo-512.png;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /assets/ {
        proxy_pass http://app:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location /api/auth/ {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 30m;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# www -> bare domain redirect (HTTPS)
server {
    listen 443 ssl;
    http2 on;
    server_name www.tabefotbal.ir;

    ssl_certificate /etc/letsencrypt/live/tabefotbal.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tabefotbal.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://tabefotbal.ir$request_uri;
}
